<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form action="thanks.html" method="get">
        <label for = "fn"><b>Full Name:</b></label><br>
        <input type = "Text" id = "fn" placeholder="Full Name" required><br>
        <label for = em><b>Email:</b></label><br>
        <input type="Email" id = "em" placeholder="Email" required><br>
        <label for = "nu"><b>Phone:</b></label><br>
        <input type="tel" id="nu" placeholder="Phone" required><br>
        <label for="ps"><b>Password:</b></label><br>
        <input type="password" id="ps" placeholder="password" required><br>
        <label><b>Gender:</b></label><br>
        <input type="radio" name="Gender" value="Male">Male<br>
        <input type="radio" name="Gender" value="Female">Female <br>
        <label><b>Subjects</b></label><br>
        <input type="checkbox" name="dept" value="Ai">Artificial Intelligence<br>
        <input type="checkbox" name="dept" value="Se">Software Engineering<br>
        <input type="checkbox" name="dept" value="Cs">Computer Science<br>
        <input type="checkbox" name="dept" value="cys">Cyber Security<br>
        <input type="checkbox" name="dept" value="It">Information Technology<br>
        <label for="rem" aria-rowcount="5"><b>Additional Details</b></label><br>
        <textarea type="text" id="rem" value="Additional Details" rows="5"></textarea><br>
        <input type="submit" id="sub" value="Submit">
        <input type="reset" id="reset" value="Reset">
    </form>
</body>
</html>
